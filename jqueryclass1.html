<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="jquery.js" type="text/javascript"></script>
<style>
    .hello{
        width: 20%;
        height: 100px;
        background-color: blueviolet;
    }
</style>
    </head>
<body>
    <h1>hello jquery </h1>
    <!-- <button id="h">HIDE</button>
    <button id="s">SHOW</button> -->
    <div class="hello"></div>
    <button id="hs">HIDE/SHOW</button>
</body>
</html>
<script>
    //print hello world 
    $(document).ready(function(){
$("h1").css("color" , "aqua");
    });
    //hide & show button
$(document).ready(function(){
 $("#h").click(function(){
         $("div").hide();
});
 $("#s").click(function(){
 $("div").show();
 });
    });
    //mix hide & show 
$(document).ready(function(){
$("#hs").click(function(){
$("div").toggle(2000);
});
});
</script>
