<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <script src="jquery.js" type="text/javascript"></script>
    <style>
        #slidebar {
            height: 100%;
            width: 0; /* hidden initially */
            background-color: black;
            z-index: 1;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 60px;
            overflow-x: hidden;
            transition: 0.5s; /* smooth transition */
        }
        #slidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }
        #slidebar a:hover {
            color: #f1f1f1;
        }
        .a {
            position: absolute;
            top: 0;
            right: 10px;
            font-size: 36px;
            margin-left: 50px;
        }
        #button {
            padding: 16px;
            margin-left: 10px; /* normal start */
            transition: 0.5s; /* smooth move */
        }
        .b {
            font-size: 20px;
            background-color: black;
            color: white;
            cursor: pointer;
            border: none;
        }
        .b:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

<div id="slidebar">
    <a href="#" class="a">&times;</a>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact Us</a>
    <a href="#">Portfolio</a>
    <a href="#">Product</a>
    <a href="#">Services</a>
    <a href="#">Blog</a>
</div>

<div id="button">
    <button class="b">≡ Slider</button>
</div>

<script>
    $(document).ready(function() {
        $(".b").click(function() {
            $("#slidebar").css("width", "250px");
            $("#button").css("margin-left", "260px");
        });

        $(".a").click(function() {
            $("#slidebar").css("width", "0");
            $("#button").css("margin-left", "10px");
        });
    });
</script>
</body>
</html>
